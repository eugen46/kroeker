<svg width="100%" viewBox="0 0 860 1295" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title>Stammbaum Kröker — Usachew</title>
<desc>Fünf Generationen der Familie Kröker: von Wolhynien über Nordkasachstan bis Berlin</desc>
<rect x="0" y="0" width="860" height="1295" fill="#ffffff"/>
<text x="430" y="34" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing="1.5" fill="#1b6ca8">1. GENERATION — URUR-URGROSSELTERN</text><rect x="210" y="48" width="200" height="60" rx="12" fill="#f6fafd" stroke="#c1d3e2" stroke-width="1"/><text x="310" y="69" text-anchor="middle" font-size="14.5" font-weight="600" fill="#131a22">Gottlieb Schulz</text><text x="310" y="86" text-anchor="middle" font-size="12" fill="#5f6c7a">Daten unbekannt · Wolhynien</text><rect x="560" y="48" width="200" height="60" rx="12" fill="#f6fafd" stroke="#c1d3e2" stroke-width="1"/><text x="660" y="69" text-anchor="middle" font-size="14.5" font-weight="600" fill="#131a22">Gottlieb Kröker</text><text x="660" y="86" text-anchor="middle" font-size="12" fill="#5f6c7a">Daten unbekannt · Wolhynien</text><text x="430" y="158" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing="1.5" fill="#1b6ca8">2. GENERATION — URGROSSELTERN</text><rect x="20" y="172" width="165" height="60" rx="12" fill="#f6fafd" stroke="#c1d3e2" stroke-width="1"/><text x="102.5" y="193" text-anchor="middle" font-size="14.5" font-weight="600" fill="#131a22">Heinrich Schulz</text><text x="102.5" y="210" text-anchor="middle" font-size="12" fill="#5f6c7a">* 1882 · Großonkel</text><rect x="200" y="172" width="165" height="60" rx="12" fill="#f6fafd" stroke="#c1d3e2" stroke-width="1"/><text x="282.5" y="193" text-anchor="middle" font-size="14.5" font-weight="600" fill="#131a22">Friedrich Schulz</text><text x="282.5" y="210" text-anchor="middle" font-size="12" fill="#5f6c7a">* 1910 · Großonkel</text><rect x="390" y="172" width="215" height="77" rx="12" fill="#f6fafd" stroke="#c1d3e2" stroke-width="1"/><text x="497.5" y="193" text-anchor="middle" font-size="14.5" font-weight="600" fill="#131a22">Emma Gotlibowna Schulz</text><text x="497.5" y="210" text-anchor="middle" font-size="12" fill="#5f6c7a">Urgroßmutter · * 1877</text><text x="497.5" y="227" text-anchor="middle" font-size="12" fill="#5f6c7a">1. Ehe — Kröker, 2. — Frelich</text><rect x="645" y="172" width="195" height="77" rx="12" fill="#f6fafd" stroke="#c1d3e2" stroke-width="1"/><text x="742.5" y="193" text-anchor="middle" font-size="14.5" font-weight="600" fill="#131a22">Johann Kröker</text><text x="742.5" y="210" text-anchor="middle" font-size="12" fill="#5f6c7a">Urgroßvater</text><text x="742.5" y="227" text-anchor="middle" font-size="12" fill="#5f6c7a">* 15.11.1864 — † ca. 1924</text><path d="M 310 108 V 140 H 102.5 V 172" stroke="#c1d3e2" stroke-width="1.6" fill="none"/><path d="M 310 108 V 140 H 282.5 V 172" stroke="#c1d3e2" stroke-width="1.6" fill="none"/><path d="M 310 108 V 140 H 497.5 V 172" stroke="#c1d3e2" stroke-width="1.6" fill="none"/><path d="M 660 108 V 140 H 742.5 V 172" stroke="#c1d3e2" stroke-width="1.6" fill="none"/><path d="M 605 210.5 L 645 210.5" stroke="#c1d3e2" stroke-width="1.6" fill="none"/><circle cx="625" cy="210.5" r="4.5" fill="#ffffff" stroke="#2f8fd4" stroke-width="1.6"/><text x="430" y="298" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing="1.5" fill="#1b6ca8">3. GENERATION — GROSSMUTTER UND GESCHWISTER</text><rect x="20" y="312" width="195" height="77" rx="12" fill="#f6fafd" stroke="#c1d3e2" stroke-width="1"/><text x="117.5" y="333" text-anchor="middle" font-size="14.5" font-weight="600" fill="#131a22">Lydia</text><text x="117.5" y="350" text-anchor="middle" font-size="12" fill="#5f6c7a">Kröker→Dreger · * 17.04.1917</text><text x="117.5" y="367" text-anchor="middle" font-size="12" fill="#5f6c7a">ab 1945 — Sennoje (Repatriierung)</text><rect x="255" y="312" width="180" height="60" rx="12" fill="#f6fafd" stroke="#c1d3e2" stroke-width="1"/><text x="345" y="333" text-anchor="middle" font-size="14.5" font-weight="600" fill="#131a22">Edmund Dreger</text><text x="345" y="350" text-anchor="middle" font-size="12" fill="#5f6c7a">* 22.07.1914 · EWZ 1944</text><rect x="475" y="312" width="160" height="77" rx="12" fill="#f6fafd" stroke="#c1d3e2" stroke-width="1"/><text x="555" y="333" text-anchor="middle" font-size="14.5" font-weight="600" fill="#131a22">Sinaida</text><text x="555" y="350" text-anchor="middle" font-size="12" fill="#5f6c7a">→Simenzowa · * 1920</text><text x="555" y="367" text-anchor="middle" font-size="12" fill="#5f6c7a">Dubowskoje</text><rect x="665" y="312" width="175" height="94" rx="12" fill="#dcedfa" stroke="#2f8fd4" stroke-width="1.5"/><text x="752.5" y="333" text-anchor="middle" font-size="14.5" font-weight="600" fill="#131a22">Emma Iwanowna</text><text x="752.5" y="350" text-anchor="middle" font-size="12" fill="#5f6c7a">Kröker · Großmutter</text><text x="752.5" y="367" text-anchor="middle" font-size="12" fill="#5f6c7a">* 05.05.1924 Uwarowka</text><text x="752.5" y="384" text-anchor="middle" font-size="12" fill="#5f6c7a">† 02.05.1987 Dubowskoje</text><path d="M 625 215.5 V 263.75 H 117.5 V 312" stroke="#c1d3e2" stroke-width="1.6" fill="none"/><path d="M 625 215.5 V 263.75 H 555 V 312" stroke="#c1d3e2" stroke-width="1.6" fill="none"/><path d="M 625 215.5 V 263.75 H 752.5 V 312" stroke="#c1d3e2" stroke-width="1.6" fill="none"/><path d="M 215 342 L 255 342" stroke="#c1d3e2" stroke-width="1.6" fill="none"/><circle cx="235" cy="342" r="4.5" fill="#ffffff" stroke="#2f8fd4" stroke-width="1.6"/><rect x="145" y="452" width="180" height="60" rx="12" fill="#f6fafd" stroke="#c1d3e2" stroke-width="1"/><text x="235" y="473" text-anchor="middle" font-size="14.5" font-weight="600" fill="#131a22">Leo Dreger</text><text x="235" y="490" text-anchor="middle" font-size="12" fill="#5f6c7a">* 08.06.1937 · Sohn von Lydia</text><path d="M 235 347 L 235 452" stroke="#c1d3e2" stroke-width="1.6" fill="none"/><rect x="400" y="452" width="235" height="77" rx="12" fill="#ffffff" stroke="#c1d3e2" stroke-width="1.2" stroke-dasharray="5,4"/><text x="517.5" y="473" text-anchor="middle" font-size="14.5" font-weight="600" fill="#131a22">„Wassili“</text><text x="517.5" y="490" text-anchor="middle" font-size="12" fill="#5f6c7a">Name im Akt Nr. 13 — laut Mutter</text><text x="517.5" y="507" text-anchor="middle" font-size="12" fill="#5f6c7a">Identität nicht geklärt</text><rect x="660" y="452" width="185" height="94" rx="12" fill="#f6fafd" stroke="#c1d3e2" stroke-width="1"/><text x="752.5" y="473" text-anchor="middle" font-size="14.5" font-weight="600" fill="#131a22">Nikolai Usachew</text><text x="752.5" y="490" text-anchor="middle" font-size="12" fill="#5f6c7a">* 1923 · Ehe mit Emma 1952</text><text x="752.5" y="507" text-anchor="middle" font-size="12" fill="#5f6c7a">Stiefvater Wladimirs</text><text x="752.5" y="524" text-anchor="middle" font-size="12" fill="#5f6c7a">Name „Usachew“ seit 1956</text><path d="M 807.5 406 V 429 H 752.5 V 452" stroke="#c1d3e2" stroke-width="1.6" fill="none"/><text x="430" y="590" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing="1.5" fill="#1b6ca8">4. GENERATION — ELTERN</text><rect x="120" y="604" width="225" height="111" rx="12" fill="#f6fafd" stroke="#c1d3e2" stroke-width="1"/><text x="232.5" y="625" text-anchor="middle" font-size="14.5" font-weight="600" fill="#131a22">Wladimir Usachew</text><text x="232.5" y="642" text-anchor="middle" font-size="12" fill="#5f6c7a">Vater · geb. als Kroeker</text><text x="232.5" y="659" text-anchor="middle" font-size="12" fill="#5f6c7a">* 08.04.1950 Sennoje</text><text x="232.5" y="676" text-anchor="middle" font-size="12" fill="#5f6c7a">† 06.08.2023 Schachty</text><text x="232.5" y="693" text-anchor="middle" font-size="12" fill="#5f6c7a">Tschernobyl-Liquidator 1986</text><rect x="415" y="604" width="160" height="60" rx="12" fill="#f6fafd" stroke="#c1d3e2" stroke-width="1"/><text x="495" y="625" text-anchor="middle" font-size="14.5" font-weight="600" fill="#131a22">Ljubow K.</text><text x="495" y="642" text-anchor="middle" font-size="12" fill="#5f6c7a">Mutter · * 1952</text><path d="M 727.5 406 V 436 H 232.5 V 604" stroke="#c1d3e2" stroke-width="1.6" fill="none"/><path d="M 517.5 529 V 566.5 H 262.5 V 604" stroke="#c1d3e2" stroke-width="1.6" fill="none" stroke-dasharray="5,4"/><path d="M 345 642 L 415 642" stroke="#c1d3e2" stroke-width="1.6" fill="none"/><circle cx="380" cy="642" r="4.5" fill="#ffffff" stroke="#2f8fd4" stroke-width="1.6"/><text x="430" y="770" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing="1.5" fill="#1b6ca8">5. GENERATION — GEGENWART</text><rect x="310" y="784" width="240" height="77" rx="12" fill="#2f8fd4" stroke="#1b6ca8" stroke-width="1.5"/><text x="430" y="805" text-anchor="middle" font-size="14.5" font-weight="600" fill="#ffffff">Eugen Usachew</text><text x="430" y="822" text-anchor="middle" font-size="12" fill="#dcedfa">* 1979 · Schachty</text><text x="430" y="839" text-anchor="middle" font-size="12" fill="#dcedfa">seit 2019 — Berlin</text><path d="M 380 647 L 380 762" stroke="#c1d3e2" stroke-width="1.6" fill="none"/><path d="M 380 762 V 773 H 430 V 784" stroke="#c1d3e2" stroke-width="1.6" fill="none"/><line x1="240" y1="895" x2="280" y2="895" stroke="#c1d3e2" stroke-width="1.6"/><text x="290" y="899" font-size="11.5" fill="#5f6c7a">durch Dokumente belegt</text><line x1="470" y1="895" x2="510" y2="895" stroke="#c1d3e2" stroke-width="1.6" stroke-dasharray="5,4"/><text x="520" y="899" font-size="11.5" fill="#5f6c7a">noch zu bestätigen</text><rect x="20" y="925" width="820" height="346" rx="14" fill="#eff5fa" stroke="#c1d3e2" stroke-width="1"/><text x="430" y="955" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.5" fill="#1b6ca8">NACH ARCHIVDOKUMENTEN</text><text x="44" y="983" font-size="12.5" fill="#131a22">Weg der Familie: Wolhynien (Uwarowka / Neu-Alexandrowka) → ~1935 Peski (Gebiet Charkiw) →</text><text x="44" y="1005" font-size="12.5" fill="#131a22">Verbannung 1941/1942 → Semipolka (1941–1946) → Sennoje (1946–1956) → Freilassung 19.01.1956</text><text x="44" y="1049" font-size="12.5" fill="#131a22">In Sondersiedlung in Nordkasachstan: Emma Iwanowna, ihre Mutter Emma Gotlibowna (Frelich),</text><text x="44" y="1071" font-size="12.5" fill="#131a22">Schwester Sinaida (Simenzowa), Onkel Heinrich und Friedrich Schulz; ab 1945 — Lydia Dreger mit Sohn Leo</text><text x="44" y="1115" font-size="12.5" font-weight="600" fill="#5f6c7a">Quellen:</text><text x="44" y="1137" font-size="12.5" fill="#5f6c7a">• Personalakte Nr. 1229 Kroeker E.I. — HDA MWS der Ukraine, F. 161 Op. 1 Nr. 877 (erhalten 14.05.2026)</text><text x="44" y="1159" font-size="12.5" fill="#5f6c7a">• Personalakte Frelich E.G. — HDA MWS der Ukraine, F. 161 Op. 1 Nr. 866 (2026)</text><text x="44" y="1181" font-size="12.5" fill="#5f6c7a">• Bescheinigung Staatsarchiv SKO Nr. FL-220 vom 15.07.2026 — bei Geburt als „Kroeker“ registriert</text><text x="44" y="1203" font-size="12.5" fill="#5f6c7a">• Hofbücher des Dorfes Sennoje, Kolchos „Kolos“ (F. 23 Op. 1)</text><text x="44" y="1225" font-size="12.5" fill="#5f6c7a">• EWZ50 Film B019, Kader 1340–1353 (MHSBC) · Generalstaatsanwaltschaft KZ — 27.09.2016</text><text x="44" y="1247" font-size="12.5" fill="#5f6c7a">• ru.openlist.wiki — Kreker Emma Iwanowna (1924)</text>
</svg>
