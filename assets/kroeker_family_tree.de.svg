<svg width="100%" viewBox="0 0 760 1180" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, sans-serif">
<title>Familienstammbaum Kröker-Usachew</title>
<desc>Fünf Generationen der Familie Kröker von Wolhynien bis Berlin — moderner Stammbaum</desc>

<style>
  .lbl-gen { font-size: 11px; font-weight: 500; fill: #1a56db; text-anchor: middle; }
  .name { font-size: 13px; font-weight: 500; fill: #0f2d5c; text-anchor: middle; }
  .name-me { font-size: 13px; font-weight: 600; fill: #fff; text-anchor: middle; }
  .name-grand { font-size: 13px; font-weight: 600; fill: #fff; text-anchor: middle; }
  .meta { font-size: 11px; fill: #4b6a9b; text-anchor: middle; }
  .meta-light { font-size: 11px; fill: #dbeafe; text-anchor: middle; }
  .meta-grand { font-size: 11px; fill: #dbeafe; text-anchor: middle; }
  .plus { font-size: 16px; font-weight: 600; fill: #0f2d5c; text-anchor: middle; }
  .small-note { font-size: 10px; fill: #6b7280; text-anchor: middle; font-style: italic; }
  .arch-title { font-size: 11px; font-weight: 500; fill: #1a56db; text-anchor: middle; }
  .arch-text { font-size: 12px; fill: #1f2937; }
  .arch-line { font-size: 11px; fill: #374151; }
  .ancestor-box { fill: #dbeafe; stroke: #1a56db; stroke-width: 0.5; stroke-dasharray: 3,2; }
  .person-box { fill: #bfdbfe; stroke: #1a56db; stroke-width: 1; }
  .grand-box { fill: #1a56db; stroke: #0f2d5c; stroke-width: 2; }
  .me-box { fill: #0f2d5c; stroke: #1a56db; stroke-width: 2; }
  .unknown-box { fill: #fff; stroke: #1a56db; stroke-width: 0.5; stroke-dasharray: 4,3; }
  .conn { stroke: #1a56db; stroke-width: 1.5; fill: none; }
  .conn-dash { stroke: #1a56db; stroke-width: 1; fill: none; stroke-dasharray: 4,3; }
</style>

<!-- ============== ПОКОЛЕНИЕ 1: ПРАПРАДЕД ============== -->
<text x="380" y="22" class="lbl-gen">1. GENERATION — URURGROSSVATER</text>
<rect x="280" y="38" width="200" height="50" rx="10" class="ancestor-box"/>
<text x="380" y="60" class="name">Gottlieb Schulz</text>
<text x="380" y="76" class="meta">Daten unbekannt · Wolhynien</text>

<!-- линия вниз к поколению 2 -->
<line x1="380" y1="88" x2="380" y2="115" class="conn"/>
<line x1="80" y1="115" x2="680" y2="115" class="conn"/>
<line x1="80" y1="115" x2="80" y2="135" class="conn"/>
<line x1="220" y1="115" x2="220" y2="135" class="conn"/>
<line x1="540" y1="115" x2="540" y2="135" class="conn"/>

<!-- ============== ПОКОЛЕНИЕ 2: ПРАБАБУШКА И ЕЁ БРАТЬЯ + ПРАДЕД ============== -->
<text x="380" y="153" class="lbl-gen">2. GENERATION — URGROSSMUTTER UND URGROSSVATER</text>

<!-- Фридрих Шульц (двоюр. прадед) -->
<rect x="20" y="170" width="120" height="50" rx="10" class="ancestor-box"/>
<text x="80" y="192" class="name">Friedrich Schulz</text>
<text x="80" y="208" class="meta">Großonkel</text>

<!-- Генрих Шульц (двоюр. прадед) -->
<rect x="160" y="170" width="120" height="50" rx="10" class="ancestor-box"/>
<text x="220" y="192" class="name">Heinrich Schulz</text>
<text x="220" y="208" class="meta">Großonkel</text>

<!-- Эмма Готлибовна (прабабушка) -->
<rect x="320" y="170" width="160" height="60" rx="10" class="person-box"/>
<text x="400" y="190" class="name">Emma Gottliebowna</text>
<text x="400" y="206" class="meta">Schulz→Kröker</text>
<text x="400" y="222" class="meta">Urgroßmutter · * 1877</text>

<!-- + знак между прабабушкой и прадедом -->
<text x="500" y="205" class="plus">+</text>

<!-- Иоганн Крёкер (прадед) -->
<rect x="520" y="170" width="160" height="60" rx="10" class="person-box"/>
<text x="600" y="190" class="name">Johann Kröker</text>
<text x="600" y="206" class="meta">Urgroßvater</text>
<text x="600" y="222" class="meta">* 15.11.1864 · Wolhynien</text>

<!-- Линия от пары "Эмма + Иоганн" вниз к 3 поколению -->
<line x1="500" y1="232" x2="500" y2="265" class="conn"/>
<line x1="180" y1="265" x2="660" y2="265" class="conn"/>
<line x1="180" y1="265" x2="180" y2="285" class="conn"/>
<line x1="380" y1="265" x2="380" y2="285" class="conn"/>
<line x1="660" y1="265" x2="660" y2="285" class="conn"/>

<!-- ============== ПОКОЛЕНИЕ 3: БАБУШКА И ЕЁ СЁСТРЫ + БИОЛОГ. ДЕД ============== -->
<text x="380" y="305" class="lbl-gen">3. GENERATION — GROSSMUTTER UND IHRE SCHWESTERN</text>

<!-- Лидия -->
<rect x="115" y="320" width="130" height="62" rx="10" class="person-box"/>
<text x="180" y="340" class="name">Lidia</text>
<text x="180" y="356" class="meta">Kröker→Dreger</text>
<text x="180" y="370" class="meta">* 17.04.1917</text>

<!-- Зинаида -->
<rect x="315" y="320" width="130" height="62" rx="10" class="person-box"/>
<text x="380" y="340" class="name">Sinaida</text>
<text x="380" y="356" class="meta">→Simenzowa</text>
<text x="380" y="370" class="meta">* 1920</text>

<!-- Эмма Ивановна (БАБУШКА — выделена) -->
<rect x="595" y="320" width="130" height="62" rx="10" class="grand-box"/>
<text x="660" y="340" class="name-grand">Emma Iwanowna</text>
<text x="660" y="356" class="meta-grand">Kröker→Usatschewa</text>
<text x="660" y="370" class="meta-grand">Großmutter · 1924</text>

<!-- + знак между бабушкой и биолог. дедом -->
<text x="569" y="358" class="plus">+</text>

<!-- ??? Василий (биолог. дед) -->
<rect x="445" y="320" width="120" height="62" rx="10" class="unknown-box"/>
<text x="505" y="340" class="name">??? Wassilij</text>
<text x="505" y="356" class="meta">biol. Großvater</text>
<text x="505" y="370" class="meta">unbekannt</text>

<!-- Линия от пары "Эмма Ивановна + Василий" вниз к Владимиру -->
<line x1="580" y1="384" x2="580" y2="420" class="conn"/>
<line x1="240" y1="420" x2="580" y2="420" class="conn"/>
<line x1="240" y1="420" x2="240" y2="445" class="conn"/>

<!-- ============== ПОКОЛЕНИЕ 4: РОДИТЕЛИ ============== -->
<text x="380" y="465" class="lbl-gen">4. GENERATION — ELTERN</text>

<!-- Владимир Усачев (отец) -->
<rect x="155" y="480" width="170" height="68" rx="10" class="person-box"/>
<text x="240" y="500" class="name">Wladimir Usatschew</text>
<text x="240" y="516" class="meta">Vater</text>
<text x="240" y="530" class="meta">* 08.04.1950</text>
<text x="240" y="544" class="meta">† 06.08.2023</text>

<!-- + знак между Владимиром и Любовью -->
<text x="395" y="520" class="plus">+</text>

<!-- Любовь (мать) -->
<rect x="425" y="480" width="170" height="68" rx="10" class="person-box"/>
<text x="510" y="500" class="name">Ljubow Alexejewna</text>
<text x="510" y="516" class="meta">Mutter</text>
<text x="510" y="530" class="meta">Kryschka</text>
<text x="510" y="544" class="meta">* 13.06.1952</text>

<!-- Усачев Николай (отчим) — маленький блок справа от Владимира -->
<rect x="155" y="560" width="170" height="32" rx="8" class="unknown-box"/>
<text x="240" y="578" class="meta">Nikolaj Usatschew</text>
<text x="240" y="588" class="small-note">Stiefvater von Wladimir · Familienname davon</text>

<!-- Линия от пары "Владимир + Любовь" вниз к Eugen -->
<line x1="395" y1="548" x2="395" y2="615" class="conn"/>

<!-- ============== ПОКОЛЕНИЕ 5: Я (Eugen) ============== -->
<text x="395" y="635" class="lbl-gen">5. GENERATION — ICH</text>
<rect x="295" y="650" width="200" height="62" rx="10" class="me-box"/>
<text x="395" y="673" class="name-me">Eugen Usachew</text>
<text x="395" y="690" class="meta-light">* 25.01.1979 · Schachty</text>
<text x="395" y="705" class="meta-light">seit 2019 — Berlin</text>

<!-- ============== Архивный блок ============== -->
<rect x="40" y="760" width="680" height="380" rx="12" fill="#f0f6ff" stroke="#bfdbfe" stroke-width="1"/>
<text x="380" y="788" class="arch-title">GENANNT IN ARCHIVBESCHEINIGUNGEN</text>

<text x="60" y="824" class="arch-text" font-weight="500">Deportiert im Oktober 1941 nach Senoje, Nordkasachstan:</text>
<text x="60" y="852" class="arch-line">• Emma Iwanowna Kröker (1924) — Großmutter</text>
<text x="60" y="876" class="arch-line">• Emma Gottliebowna Schulz→Kröker (1877) — ihre Mutter (Urgroßmutter)</text>
<text x="60" y="900" class="arch-line">• Sinaida Simenzowa (1920) — ihre Schwester</text>
<text x="60" y="924" class="arch-line">• Heinrich Gottliebowitsch Schulz — ihr Onkel (Bruder der Urgroßmutter)</text>
<text x="60" y="948" class="arch-line">• Friedrich Gottliebowitsch Schulz — ihr Onkel (Bruder der Urgroßmutter)</text>

<text x="60" y="990" class="arch-text" font-weight="500">Quellen:</text>
<text x="60" y="1018" class="arch-line">• Archivbescheinigung der Generalstaatsanwaltschaft Kasachstans vom 27.09.2016 (№ 2-20-16-07254)</text>
<text x="60" y="1042" class="arch-line">• Archivbescheinigung des GUMWS Charkiw (2015)</text>
<text x="60" y="1066" class="arch-line">• EWZ50 Film B019 (Bundesarchiv Berlin) — Bilder 1340–1364</text>
<text x="60" y="1090" class="arch-line">• openlist.wiki (Datenbank der Opfer politischer Repression in der UdSSR)</text>


<!-- Соединение пары: Эмма Готлибовна + Иоганн -->
<line x1="480" y1="205" x2="494" y2="205" class="conn"/>
<line x1="506" y1="205" x2="520" y2="205" class="conn"/>

<!-- Соединение пары: Эмма Ивановна + Василий (биолог. дед) -->
<line x1="565" y1="358" x2="566" y2="358" class="conn-dash"/>
<line x1="572" y1="358" x2="595" y2="358" class="conn"/>

<!-- Соединение пары: Владимир + Любовь -->
<line x1="325" y1="520" x2="392" y2="520" class="conn"/>
<line x1="398" y1="520" x2="425" y2="520" class="conn"/>

</svg>