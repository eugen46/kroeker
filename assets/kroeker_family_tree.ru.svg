<svg width="100%" viewBox="0 0 760 1180" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, sans-serif">
<title>Семейное древо Крёкер-Усачёв</title>
<desc>Пять поколений семьи Крёкер с Волыни до Берлина</desc>

<style>
  .lbl-gen { font-size: 12px; font-weight: 500; fill: #1a56db; text-anchor: middle; }
  .name { font-size: 15px; font-weight: 500; fill: #0f2d5c; text-anchor: middle; }
  .name-me { font-size: 15px; font-weight: 600; fill: #fff; text-anchor: middle; }
  .name-grand { font-size: 15px; font-weight: 600; fill: #fff; text-anchor: middle; }
  .meta { font-size: 13px; fill: #4b6a9b; text-anchor: middle; }
  .meta-light { font-size: 13px; fill: #dbeafe; text-anchor: middle; }
  .meta-grand { font-size: 13px; fill: #dbeafe; text-anchor: middle; }
  .plus { font-size: 16px; font-weight: 600; fill: #0f2d5c; text-anchor: middle; }
  .small-note { font-size: 12px; fill: #6b7280; text-anchor: middle; font-style: italic; }
  .arch-title { font-size: 13px; font-weight: 500; fill: #1a56db; text-anchor: middle; }
  .arch-text { font-size: 14px; fill: #1f2937; }
  .arch-line { font-size: 13px; fill: #374151; }
  .ancestor-box { fill: #dbeafe; stroke: #1a56db; stroke-width: 0.5; stroke-dasharray: 3,2; }
  .person-box { fill: #bfdbfe; stroke: #1a56db; stroke-width: 1; }
  .grand-box { fill: #1a56db; stroke: #0f2d5c; stroke-width: 2; }
  .me-box { fill: #0f2d5c; stroke: #1a56db; stroke-width: 2; }
  .unknown-box { fill: #fff; stroke: #1a56db; stroke-width: 0.5; stroke-dasharray: 4,3; }
  .conn { stroke: #1a56db; stroke-width: 1.5; fill: none; }
  .conn-dash { stroke: #1a56db; stroke-width: 1; fill: none; stroke-dasharray: 4,3; }
</style>

<!-- ============== ПОКОЛЕНИЕ 1: ПРАПРАДЕД ============== -->
<text x="380" y="22" class="lbl-gen">1 ПОКОЛЕНИЕ — ПРАПРАДЕД</text>
<rect x="280" y="38" width="200" height="50" rx="10" class="ancestor-box"/>
<text x="380" y="60" class="name">Готлиб Шульц</text>
<text x="380" y="76" class="meta">даты неизвестны · Волынь</text>

<!-- линия вниз к поколению 2 -->
<line x1="380" y1="88" x2="380" y2="115" class="conn"/>
<line x1="80" y1="115" x2="680" y2="115" class="conn"/>
<line x1="80" y1="115" x2="80" y2="135" class="conn"/>
<line x1="220" y1="115" x2="220" y2="135" class="conn"/>
<line x1="540" y1="115" x2="540" y2="135" class="conn"/>

<!-- ============== ПОКОЛЕНИЕ 2: ПРАБАБУШКА И ПРАДЕД ============== -->
<text x="380" y="153" class="lbl-gen">2 ПОКОЛЕНИЕ — ПРАБАБУШКА И ПРАДЕД</text>

<!-- Фридрих Шульц -->
<rect x="20" y="170" width="120" height="50" rx="10" class="ancestor-box"/>
<text x="80" y="192" class="name">Фридрих Шульц</text>
<text x="80" y="208" class="meta">двоюр. прадед</text>

<!-- Генрих Шульц -->
<rect x="160" y="170" width="120" height="50" rx="10" class="ancestor-box"/>
<text x="220" y="192" class="name">Генрих Шульц</text>
<text x="220" y="208" class="meta">двоюр. прадед</text>

<!-- Эмма Готлибовна (прабабушка) -->
<rect x="320" y="170" width="160" height="60" rx="10" class="person-box"/>
<text x="400" y="190" class="name">Эмма Готлибовна</text>
<text x="400" y="206" class="meta">Шульц→Крёкер</text>
<text x="400" y="222" class="meta">прабабушка · * 1877</text>

<!-- + знак -->
<text x="500" y="205" class="plus">+</text>

<!-- Иоганн Крёкер (прадед) -->
<rect x="520" y="170" width="160" height="60" rx="10" class="person-box"/>
<text x="600" y="190" class="name">Иоганн Крёкер</text>
<text x="600" y="206" class="meta">прадед</text>
<text x="600" y="222" class="meta">* 15.11.1864 · Волынь</text>

<!-- Соединение пары "Эмма Готлибовна + Иоганн" -->
<line x1="480" y1="205" x2="494" y2="205" class="conn"/>
<line x1="506" y1="205" x2="520" y2="205" class="conn"/>

<!-- Линия от пары вниз к 3 поколению -->
<line x1="500" y1="232" x2="500" y2="265" class="conn"/>
<line x1="180" y1="265" x2="660" y2="265" class="conn"/>
<line x1="180" y1="265" x2="180" y2="285" class="conn"/>
<line x1="380" y1="265" x2="380" y2="285" class="conn"/>
<line x1="660" y1="265" x2="660" y2="285" class="conn"/>

<!-- ============== ПОКОЛЕНИЕ 3: БАБУШКА И ЕЁ СЁСТРЫ ============== -->
<text x="380" y="305" class="lbl-gen">3 ПОКОЛЕНИЕ — БАБУШКА И ЕЁ СЁСТРЫ</text>

<!-- Лидия -->
<rect x="115" y="320" width="130" height="62" rx="10" class="person-box"/>
<text x="180" y="340" class="name">Лидия</text>
<text x="180" y="356" class="meta">Крёкер→Дрегер</text>
<text x="180" y="370" class="meta">* 17.04.1917</text>

<!-- Зинаида -->
<rect x="315" y="320" width="130" height="62" rx="10" class="person-box"/>
<text x="380" y="340" class="name">Зинаида</text>
<text x="380" y="356" class="meta">→Сименцова</text>
<text x="380" y="370" class="meta">* 1920</text>

<!-- Эмма Ивановна (БАБУШКА — выделена) -->
<rect x="595" y="320" width="130" height="62" rx="10" class="grand-box"/>
<text x="660" y="340" class="name-grand">Эмма Ивановна</text>
<text x="660" y="356" class="meta-grand">Крёкер→Усачева</text>
<text x="660" y="370" class="meta-grand">бабушка · 1924</text>

<!-- ============== ПРОМЕЖУТОЧНЫЙ УРОВЕНЬ: ??? ВАСИЛИЙ (биолог. отец, не пара бабушке) ============== -->
<!-- Линия от Эммы Ивановны вниз к Владимиру (через эту зону) -->
<line x1="660" y1="382" x2="660" y2="430" class="conn"/>
<line x1="240" y1="430" x2="660" y2="430" class="conn"/>
<line x1="240" y1="430" x2="240" y2="465" class="conn"/>

<!-- ??? Василий — отдельный блок справа от линии, СО ЗНАКОМ ВОПРОСА, не парой -->
<rect x="380" y="408" width="160" height="44" rx="10" class="unknown-box"/>
<text x="460" y="426" class="name">??? Василий</text>
<text x="460" y="442" class="meta">биолог. отец Владимира · неизвестен</text>

<!-- Пунктирная стрелка от Василия → к Владимиру (биолог. связь) -->
<line x1="460" y1="452" x2="460" y2="475" class="conn-dash"/>
<line x1="240" y1="475" x2="460" y2="475" class="conn-dash"/>
<line x1="240" y1="475" x2="240" y2="485" class="conn-dash"/>

<!-- ============== ПОКОЛЕНИЕ 4: РОДИТЕЛИ ============== -->
<text x="380" y="505" class="lbl-gen">4 ПОКОЛЕНИЕ — РОДИТЕЛИ</text>

<!-- Владимир Усачев -->
<rect x="155" y="520" width="170" height="68" rx="10" class="person-box"/>
<text x="240" y="540" class="name">Владимир Усачев</text>
<text x="240" y="556" class="meta">отец</text>
<text x="240" y="570" class="meta">* 08.04.1950</text>
<text x="240" y="584" class="meta">† 06.08.2023</text>

<!-- + знак -->
<text x="395" y="560" class="plus">+</text>

<!-- Любовь Алексеевна -->
<rect x="425" y="520" width="170" height="68" rx="10" class="person-box"/>
<text x="510" y="540" class="name">Любовь Алексеевна</text>
<text x="510" y="556" class="meta">мать</text>
<text x="510" y="570" class="meta">Крышка</text>
<text x="510" y="584" class="meta">* 13.06.1952</text>

<!-- Соединение пары -->
<line x1="325" y1="560" x2="392" y2="560" class="conn"/>
<line x1="398" y1="560" x2="425" y2="560" class="conn"/>

<!-- Усачев Николай — отчим (маленький блок снизу слева) -->
<rect x="155" y="600" width="170" height="32" rx="8" class="unknown-box"/>
<text x="240" y="618" class="meta">Усачев Николай</text>
<text x="240" y="628" class="small-note">отчим Владимира · фамилия по нему</text>

<!-- Линия от пары "Владимир + Любовь" вниз к Eugen -->
<line x1="395" y1="588" x2="395" y2="655" class="conn"/>

<!-- ============== ПОКОЛЕНИЕ 5: Я (Eugen) ============== -->
<text x="395" y="675" class="lbl-gen">5 ПОКОЛЕНИЕ — Я</text>
<rect x="295" y="690" width="200" height="62" rx="10" class="me-box"/>
<text x="395" y="713" class="name-me">Евгений Усачёв</text>
<text x="395" y="730" class="meta-light">* 25.01.1979 · Шахты</text>
<text x="395" y="745" class="meta-light">с 2019 — Берлин</text>

<!-- ============== Архивный блок ============== -->
<rect x="40" y="800" width="680" height="370" rx="12" fill="#f0f6ff" stroke="#bfdbfe" stroke-width="1"/>
<text x="380" y="828" class="arch-title">УПОМЯНУТЫ В АРХИВНЫХ СПРАВКАХ</text>

<text x="60" y="864" class="arch-text" font-weight="500">Депортированы в октябре 1941 в с. Сенное, Сев.-Казахст. обл.:</text>
<text x="60" y="892" class="arch-line">• Эмма Ивановна Крёкер (1924) — бабушка</text>
<text x="60" y="916" class="arch-line">• Эмма Готлибовна Шульц→Крёкер (1877) — её мать (прабабушка)</text>
<text x="60" y="940" class="arch-line">• Зинаида Сименцова (1920) — её сестра</text>
<text x="60" y="964" class="arch-line">• Генрих Готлибович Шульц — её дядя (брат прабабушки)</text>
<text x="60" y="988" class="arch-line">• Фридрих Готлибович Шульц — её дядя (брат прабабушки)</text>

<text x="60" y="1024" class="arch-text" font-weight="500">Источники:</text>
<text x="60" y="1052" class="arch-line">• Архивная справка Генпрокуратуры Казахстана от 27.09.2016 (№ 2-20-16-07254)</text>
<text x="60" y="1076" class="arch-line">• Архивная справка ГУМВД Харьковской области (2015)</text>
<text x="60" y="1100" class="arch-line">• EWZ50 Film B019 (Bundesarchiv Berlin) — кадры 1340–1364</text>
<text x="60" y="1124" class="arch-line">• openlist.wiki (база жертв политических репрессий в СССР)</text>

</svg>