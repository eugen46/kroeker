<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#134f7d"/>
      <stop offset="50%" stop-color="#2f8fd4"/>
      <stop offset="100%" stop-color="#6fb1de"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef5ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>

  <!-- Фон -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="600" cy="315" rx="600" ry="315" fill="url(#glow)"/>

  <!-- Логотип в углу -->
  <g transform="translate(60, 60)">
    <rect width="72" height="72" rx="16" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
    <text x="36" y="52" text-anchor="middle" font-weight="700" font-size="48" fill="#fff">K</text>
  </g>

  <text x="160" y="92" font-size="22" font-weight="500" fill="rgba(255,255,255,0.85)" letter-spacing="2">KROEKER · КРЁКЕР · КРЕКЕР</text>
  <text x="160" y="120" font-size="16" fill="rgba(255,255,255,0.6)">kroeker-family.com</text>

  <!-- Главный заголовок -->
  <text x="60" y="270" font-size="68" font-weight="700" fill="#fff">Die Kröker</text>
  <text x="60" y="330" font-size="34" font-weight="500" fill="rgba(255,255,255,0.9)">5 Generationen · von Wolhynien nach Berlin</text>

  <!-- Маршрут -->
  <g transform="translate(60, 410)">
    <!-- Линия маршрута -->
    <line x1="20" y1="40" x2="1080" y2="40" stroke="rgba(255,255,255,0.35)" stroke-width="2" stroke-dasharray="6 6"/>

    <!-- Точки маршрута -->
    <g>
      <circle cx="20" cy="40" r="10" fill="#fff"/>
      <text x="20" y="85" text-anchor="middle" font-size="20" font-weight="600" fill="#fff">Preußen</text>
      <text x="20" y="108" text-anchor="middle" font-size="14" fill="rgba(255,255,255,0.7)">bis 1864</text>
    </g>

    <g>
      <circle cx="280" cy="40" r="10" fill="#fff"/>
      <text x="280" y="85" text-anchor="middle" font-size="20" font-weight="600" fill="#fff">Wolhynien</text>
      <text x="280" y="108" text-anchor="middle" font-size="14" fill="rgba(255,255,255,0.7)">1864–1941</text>
    </g>

    <g>
      <circle cx="540" cy="40" r="10" fill="#fff"/>
      <text x="540" y="85" text-anchor="middle" font-size="20" font-weight="600" fill="#fff">Sennoje / KasSSR</text>
      <text x="540" y="108" text-anchor="middle" font-size="14" fill="rgba(255,255,255,0.7)">1941–1955</text>
    </g>

    <g>
      <circle cx="800" cy="40" r="10" fill="#fff"/>
      <text x="800" y="85" text-anchor="middle" font-size="20" font-weight="600" fill="#fff">Schachty</text>
      <text x="800" y="108" text-anchor="middle" font-size="14" fill="rgba(255,255,255,0.7)">1955–2019</text>
    </g>

    <g>
      <circle cx="1080" cy="40" r="14" fill="#fff" stroke="#2f8fd4" stroke-width="3"/>
      <text x="1080" y="85" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">Berlin</text>
      <text x="1080" y="108" text-anchor="middle" font-size="14" fill="rgba(255,255,255,0.8)">ab 2019</text>
    </g>
  </g>

  <!-- Подпись внизу -->
  <text x="60" y="600" font-size="16" fill="rgba(255,255,255,0.6)">Wolhyniendeutsche · Deportation 1941 · Archivforschung · EWZ · Ahnengeschichte</text>
</svg>
