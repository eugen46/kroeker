name: Clean macOS metadata files
on:
  push:
    paths:
      - '.github/workflows/codex-clean-appledouble.yml'
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove metadata files
        run: |
          find . -name '._*' -type f -delete
          rm -f .github/workflows/codex-clean-appledouble.yml
      - name: Commit cleanup
        run: |
          git config user.name 'codex-publisher'
          git config user.email 'codex-publisher@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Remove macOS metadata files'
            git push
          fi
