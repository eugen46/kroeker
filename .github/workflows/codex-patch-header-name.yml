name: Codex patch header name

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/codex-patch-header-name.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          replacements = {
              '<div class="hdr-logo" id="hl">Kroeker Family</div>': '<div class="hdr-logo" id="hl">Kroeker</div>',
              '"hl": "Familie Kroeker",': '"hl": "Kroeker",',
              '"hl": "\\u0421\\u0435\\u043c\\u044c\\u044f \\u041a\\u0440\\u0451\\u043a\\u0435\\u0440",': '"hl": "\\u041a\\u0440\\u0451\\u043a\\u0435\\u0440",',
              '"hl": "Kroeker Family",': '"hl": "Kroeker",',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Expected text not found: {old!r}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          rm .github/workflows/codex-patch-header-name.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/codex-patch-header-name.yml
          git commit -m "Shorten header logo text"
          git push
