name: Codex patch search width

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/codex-patch-search.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old1 = '.top-search{position:relative;flex:0 1 240px;max-width:240px;min-width:165px;margin-left:auto}'
          new1 = '.top-search{position:relative;flex:0 1 200px;max-width:200px;min-width:150px;margin-left:auto}'
          old2 = '  .top-search{order:20;flex:0 1 480px;max-width:480px;min-width:300px;margin-left:auto}'
          new2 = '  .top-search{order:20;flex:0 1 340px;max-width:340px;min-width:240px;margin-left:auto}'
          if old1 not in s or old2 not in s:
              raise SystemExit('Expected search width rules not found')
          s = s.replace(old1, new1).replace(old2, new2)
          p.write_text(s)
          PY
          rm .github/workflows/codex-patch-search.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/codex-patch-search.yml
          git commit -m "Adjust search field width"
          git push
