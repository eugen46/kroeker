name: Codex patch German header

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/codex-patch-de-header.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '"hl": "Kroeker",'
          new = '"hl": "Kr\\u00f6ker",'
          if old not in s:
              raise SystemExit('Expected German header value not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          rm .github/workflows/codex-patch-de-header.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/codex-patch-de-header.yml
          git commit -m "Use German spelling in header"
          git push
