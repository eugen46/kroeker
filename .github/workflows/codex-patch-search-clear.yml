name: Codex patch search clear

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/codex-patch-search-clear.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          replacements = {
              '.search-wrap{display:flex;align-items:center;width:100%}': '.search-wrap{display:flex;align-items:center;width:100%;position:relative}',
              'width:100%;height:38px;padding:.15rem 2.25rem .15rem .9rem;': 'width:100%;height:38px;padding:.15rem 2rem .15rem .9rem;',
              'position:absolute;right:.45rem;top:50%;transform:translateY(-50%);\n  width:28px;height:28px;border:0;border-radius:8px;background:transparent;color:#4b5563;': 'position:absolute;right:.35rem;top:50%;transform:translateY(-50%);\n  width:26px;height:26px;border:0;border-radius:8px;background:transparent;color:#4b5563;',
              'transition:background .15s,color .15s\n}': 'transition:background .15s,color .15s;z-index:3\n}',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Expected text not found: {old!r}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          rm .github/workflows/codex-patch-search-clear.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/codex-patch-search-clear.yml
          git commit -m "Fix search clear button visibility"
          git push
