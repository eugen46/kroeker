name: Apply language persistence fix
on:
  push:
    paths:
      - '.github/workflows/codex-lang-fix.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download site payload
        run: |
          curl -fsSL 'https://n.uguu.se/PbjYakUX.xz' -o /tmp/site.tar.xz
          tar -xJf /tmp/site.tar.xz -C "$GITHUB_WORKSPACE"
          rm -f .github/workflows/codex-lang-fix.yml
      - name: Commit changes
        run: |
          git config user.name 'codex-publisher'
          git config user.email 'codex-publisher@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Preserve selected language across pages'
            git push
          fi
